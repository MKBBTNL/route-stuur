<!DOCTYPE html>
<!--
  BOAT BIKE TOURS · ROUTE NOTE TEMPLATE
  ══════════════════════════════════════════════════════════════════════
  The house day-sheet, set up as a base to edit in VS Code.
  routekit fills the FRAME automatically; you hand-author the MIDDLE.
  (Token names below are written without their braces so this comment
   isn't itself filled — in the body they look like LANG wrapped in {{ }}.)

  routekit fills these on every build:
      LANG      html language (en / nl / de)
      DAY       eyebrow, e.g. "DAY 02"  (localised; blank if unknown)
      TITLE     "Origin - Destination"
      DISTANCE  e.g. "30 km"
      TIMELINE  the knooppunt ribbon (dots · km · towns) — generated
      ROUTE     a plain node-sequence DRAFT for you to rewrite
      QR / QR_CODE   per-language QR image + code, or blank

  You hand-author these (routekit leaves them blank; empty ones hide):
      ROUTE_PILL  the coloured route pill text
      SHIP        ship name + phone
      HIGHLIGHTS  the "Onderweg" blocks (coffee / highlights / safety)

  HIGHLIGHTS block markup: <div class="block {cls}"><h3>{icon}{title}</h3>
  <ul><li>...</li></ul></div> — {cls} is lunch/high/safe (colours the
  heading), {icon} is one <svg class="gi" .../> from the BBT glyph set
  (stroke="currentColor" so it follows {cls}'s colour). Five block types
  only, per Marc's call (2026-08-20 — a wider 16-icon set was tried and
  rolled back): coffee, highlight, safety, ferry, info. route_builder.html's
  ICONS/BLOCK_TYPES dicts are the canonical list — copy an icon's <path>
  data from there rather than re-drawing one by hand.

  A knooppunt node can carry class="node ferry" (instead of plain "node") to
  mark a ferry/veerpont crossing on the connector before it — renders as a
  dashed line + boat glyph. route_builder.html's "ferry before" checkbox
  writes this automatically; add it by hand here if editing a sheet directly.

  Brand-constant bits are plain literals below — edit them once and they
  flow to every sheet: the LOGO, the footer labels, "scan for GPS", etc.
  To preview: run  routekit build <route>.gpx  and open the .html it writes.
-->
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Albert+Sans:wght@400;500;600&display=swap');

/* ═══════════════════════════  EDIT ME  ═══════════════════════════
   The whole look lives here. Change a value once; it flows everywhere. */
:root{
  /* — brand palette — */
  --blue:#0E55A6;      /* primary blue: node dots, accents               */
  --dark:#043D7D;      /* dark blue: title, rules, final node            */
  --green:#40D9AB;     /* teal: distance, bullets                        */
  --red:#BF3B26;       /* warning red: "let op" pill/blocks              */
  --ink:#303038;       /* body text                                      */
  --soft:#EEF6FF;      /* soft fill                                      */
  --line:#d7e3f2;      /* hairlines + node connector line                */
  --gray:#7a8394;      /* muted captions                                 */
  /* — type — */
  --display:'Outfit',system-ui,sans-serif;      /* headings, numbers     */
  --body:'Albert Sans',system-ui,sans-serif;    /* running text          */
  --fs-read:18px;      /* main reading size (route prose, lists)         */
  /* — knooppunt ribbon — */
  --dot:40px;          /* node badge diameter                            */
  --dot-fs:17px;       /* number size inside the badge                   */
  /* — page — */
  --pad:40px 52px;     /* A4 inner margins                               */
}
/* ═════════════════════════════════════════════════════════════════ */

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);color:var(--ink);background:#e9edf2;padding:24px;font-size:var(--fs-read)}
.page{width:794px;min-height:1123px;margin:0 auto;background:#fff;padding:var(--pad);box-shadow:0 2px 14px rgba(0,0,0,.12)}
h1,h2,h3,.day{font-family:var(--display)}

/* ── header ── */
header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--dark);padding-bottom:16px;gap:22px}
.logo{flex:none}.logo img{height:58px;display:block}
.logo .wordmark{font:800 20px/1 var(--display);color:var(--dark);letter-spacing:.5px}  /* fallback if you don't paste a logo */
.head-mid{flex:1;text-align:left}
.day-row{display:flex;align-items:center;gap:10px;min-height:20px}
.day{font-weight:800;color:var(--blue);font-size:13px;letter-spacing:3px}
.route-pill{font:700 10px var(--display);letter-spacing:1px;text-transform:uppercase;color:#fff;background:var(--blue);border-radius:20px;padding:3px 11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.route-pill:empty{display:none}
.route-pill.red{background:var(--red)}
h1{font-weight:700;color:var(--dark);font-size:25px;margin-top:5px;line-height:1.12}
.dist{color:var(--green);font-weight:700;font-size:16px;margin-top:4px;font-family:var(--display)}
.dist svg.mi{width:15px;height:15px;vertical-align:-2px;margin-right:4px;stroke:currentColor}
.callship{font-size:12px;color:var(--dark);margin-top:7px}.callship b{font-family:var(--display);color:var(--blue)}
.callship .ship:empty::before{content:"—";color:var(--gray);font-weight:400}
.qr{flex:none;text-align:center}
.qr .qrimg img{width:74px;height:74px;display:block;border-radius:6px;border:1px solid var(--line)}
.qr .code{display:block;font:700 11px var(--display);color:var(--dark);margin-top:4px;letter-spacing:1px}
.qr small{display:block;font-size:8px;color:var(--gray);letter-spacing:.5px}

/* ── knooppunt ribbon (generated by routekit) ── */
.timeline{margin:22px 0 4px}
.tl-track{display:flex;flex-wrap:wrap;row-gap:26px}
.node{flex:0 0 12.5%;text-align:center;position:relative;padding-top:2px}         /* 8 nodes per row */
.node::before{content:"";position:absolute;top:calc(var(--dot)/2 - 1px);left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.node:nth-child(8n+1)::before{display:none}
.dot{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;
     width:var(--dot);height:var(--dot);border-radius:50%;background:var(--blue);border:2px solid var(--blue);
     color:#fff;font:700 var(--dot-fs) var(--display);margin:0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dot.end{background:var(--dark);border-color:var(--dark)}
.node .km{display:block;font-size:11px;color:var(--gray);margin-top:5px;font-variant-numeric:tabular-nums}
.node .town{display:block;font:700 11px var(--display);color:var(--dark);margin-top:2px;line-height:1.1}
/* compact tiers: shrink the ribbon as it grows past ~3 rows (scaled from the 40px base) */
.tl-track[data-rows="4"] .dot,.tl-track[data-rows="5"] .dot,.tl-track[data-rows="6"] .dot{width:34px;height:34px;font-size:15px}
.tl-track[data-rows="4"],.tl-track[data-rows="5"],.tl-track[data-rows="6"]{row-gap:20px}
.tl-track[data-rows="5"] .dot,.tl-track[data-rows="6"] .dot{width:30px;height:30px;font-size:13.5px}
.tl-track[data-rows="5"],.tl-track[data-rows="6"]{row-gap:16px}
.tl-track[data-rows="4"] .km,.tl-track[data-rows="5"] .km,.tl-track[data-rows="6"] .km{font-size:9.5px;margin-top:3px}
.tl-track[data-rows="4"] .town,.tl-track[data-rows="5"] .town,.tl-track[data-rows="6"] .town{font-size:9.5px}

/* ── ferry / veerpont crossing: dashed line + boat glyph on the connector
   between this node and the previous one -- add class="node ferry" by hand,
   or let route_builder.html's "ferry before" checkbox write it for you ── */
.node.ferry::before{background:none;border-top:2px dashed var(--blue);height:0}
.node:nth-child(8n+1).ferry::before{display:none}
.node .ferry-boat{position:absolute;left:-50%;width:100%;top:calc(var(--dot)/2 - 10px);
  display:flex;justify-content:center;z-index:1;pointer-events:none}
.node .ferry-boat svg{width:19px;height:19px;background:#fff;color:var(--blue)}
.node:nth-child(8n+1) .ferry-boat{display:none}
.tl-track[data-rows="4"] .ferry-boat,.tl-track[data-rows="5"] .ferry-boat,.tl-track[data-rows="6"] .ferry-boat{top:calc(var(--dot)/2 - 8px)}
.tl-track[data-rows="4"] .ferry-boat svg,.tl-track[data-rows="5"] .ferry-boat svg,.tl-track[data-rows="6"] .ferry-boat svg{width:15px;height:15px}

/* ── section headings ── */
h2{font-family:var(--display);font-weight:700;color:var(--dark);font-size:14px;letter-spacing:1.5px;text-transform:uppercase;margin:24px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line)}

/* ── route prose (hand-authored middle) ── */
.route:empty{display:none}
.route p{font-size:var(--fs-read);line-height:1.6;margin-bottom:10px}
.route .rk-draft{color:var(--gray);font-style:italic}   /* routekit's node-sequence draft */
.jct{color:var(--blue);font-weight:600}

/* ── "onderweg" info blocks (hand-authored middle) ── */
.info{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;margin-top:6px}
.info:empty{display:none}
.block h3{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.5px;margin-bottom:5px;display:flex;align-items:center;gap:7px}
.block.lunch h3,.block.high h3{color:var(--dark)}.block.safe h3{color:var(--red)}
.gi{width:15px;height:15px;flex:none}
.block ul{list-style:none;font-size:15px;line-height:1.5}
.block li{padding-left:12px;position:relative;margin-bottom:3px}
.block li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--green)}
.block.safe li::before{background:var(--red)}

/* ── footer ── */
footer{display:flex;gap:60px;margin-top:24px;padding-top:14px;border-top:3px solid var(--dark);font-size:12px}
footer .t{min-width:200px}
footer .t b{display:block;font:700 10px var(--display);letter-spacing:1px;color:var(--blue)}
footer .t svg.mi{width:13px;height:13px;vertical-align:-2px;margin-right:3px;color:var(--blue)}

@media print{
  body{background:#fff;padding:0}
  .page{box-shadow:none;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
